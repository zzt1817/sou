name: EPG Auto Update Multi Source
on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *' # UTC16:30 = 北京时间 00:30
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmlstarlet
        run: sudo apt update && sudo apt install -y xmlstarlet

      - name: Try multiple EPG sources
        run: |
          # 设置时区 上海时间
          export TZ=Asia/Shanghai
          sources=(
            "https://epg.112114.xyz/pp.xml.gz"
            "https://iptv-org.github.io/epg/guides/cn.xml"
          )
          success=0
          for url in "${sources[@]}"; do
            echo "Trying source: $url"
            if curl -sL --connect-timeout 20 "$url" -o full.xml; then
              echo "✅ Download success: $url"
              success=1
              break
            fi
            echo "❌ Failed, try next source..."
          done
          if [ $success -ne 1 ]; then
            echo "❌ All sources download failed!"
            exit 1
          fi

          TODAY=$(date +%Y%m%d)
          TOMORROW=$(date -d "+1 day" +%Y%m%d)
          echo "保留范围：$TODAY 全天 ~ $TOMORROW 06:00"

          # 删除：不在【今天全天，或明天0点~6点】的节目
          # 规则：保留 start=今天所有，或者 start=明天并且小时小于06
          xmlstarlet ed \
            -d "//program[
              not(
                starts-with(@start,'$TODAY')
                or
                (starts-with(@start,'$TOMORROW') and substring(@start,9,2) < '06')
              )
            ]" \
            full.xml > e.xml

          cp e.xml all.xml
          gzip -f e.xml
          gzip -f all.xml

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add e.xml.gz all.xml.gz
          git commit -m "Auto update EPG $(date +%Y-%m-%d)" || echo "No changes"
          git push
