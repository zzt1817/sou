name: EPG Auto Update Multi Source
on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *' # UTC16:30 = 北京时间 00:30
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmlstarlet（xml过滤工具）
        run: sudo apt update && sudo apt install -y xmlstarlet

      - name: Try multiple EPG sources
        run: |
          # 源列表
          sources=(
            "https://epg.112114.xyz/pp.xml"
            "https://iptv-org.github.io/epg/guides/cn.xml"
          )
          success=0
          for url in "${sources[@]}"; do
            echo "Trying source: $url"
            if curl -sL --connect-timeout 20 "$url" -o full.xml; then
              echo "✅ Download success: $url"
              success=1
              break
            fi
            echo "❌ Failed, try next source..."
          done
          if [ $success -ne 1 ]; then
            echo "❌ All sources download failed!"
            exit 1
          fi

          # 计算今天日期 YYYYMMDD
          TODAY=$(date +%Y%m%d)
          echo "保留日期: $TODAY"

          # 过滤：只保留start属性以今天开头的program节目
          xmlstarlet ed -d "//program[not(starts-with(@start,'$TODAY'))]" full.xml > e.xml

          # 复制为all.xml
          cp e.xml all.xml
          gzip -f e.xml
          gzip -f all.xml

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add e.xml.gz all.xml.gz
          git commit -m "Auto update EPG $(date +%Y-%m-%d)" || echo "No changes"
          git push
